version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: traffic_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - traffic_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: traffic_server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/smart_traffic_db
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - traffic_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: traffic_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - traffic_net

networks:
  traffic_net:
    driver: bridge

volumes:
  mongo_data:
